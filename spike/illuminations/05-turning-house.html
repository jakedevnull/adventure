<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Crossroads — Illumination spike</title>
<link rel="stylesheet" href="illumination.css">
</head>
<body>
<main id="term"></main>
<script src="illumination.js"></script>
<script>
Illum.chrome('hearth', 'the Turning House at dusk · guttering windows, drifting smoke · warm inks');

var ART = {
  cols: 50, rows: 18,
  palette: 'hearth',
  layers: [
    { name: 'smoke', rows: [
      '                                 bc',
      '                                a'
      ],
      legend: {
        'a': { frames: 'o°·  ', ink: 4 },
        'b': { frames: '·o°  ', ink: 4, phase: 3 },
        'c': { frames: '  ·° ', ink: 4, phase: 1 }
      }
    },
    { name: 'inn', rows: [
      '     ☾                          ██',
      '                                ██',
      '                                ██',
      '       ╱▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔▔╲',
      '      ╱░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░╲',
      '     ╱░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░╲',
      '        ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀',
      '        █╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲█',
      '        █  ▓▓▓          ▓▓▓         █──────',
      '        █  ▓▓▓          ▓▓▓         █    |',
      '        █            ╭──╮           █ ┌─────┐',
      '        █            │▒▒│           █ │  ◉  │',
      '        █            │▒▒│           █ └─────┘',
      '        █            │▒•│           █',
      '        █            │▒▒│           █',
      '        █▄▄▄▄▄▄▄▄▄▄▄▄│▒▒│▄▄▄▄▄▄▄▄▄▄▄█',
      ' ∙ ∙  ∙∙ ∙ ∙ ∙  ∙ ∙∙ ∙ ∙ ∙ ∙∙ ∙  ∙ ∙ ∙∙ ∙ ∙  ∙ ∙',
      ''
      ],
      legend: {
        '☾': 15,
        '█': 6, '▀': 7, '▄': 7, '▔': 7, '░': 5, '╱': 7, '╲': 5,
        '▓': { frames: '████', inks: [9, 10, 9, 11], stagger: 'grid' },
        '╭': 8, '╮': 8, '│': 8, '▒': 7, '•': 10,
        '─': 8, '┌': 8, '┐': 8, '└': 8, '┘': 8,
        '|': { frames: '│╱│╲', ink: 8 },
        '◉': { frames: '◉◉◉○', ink: 9 },
        '∙': 5
      }
    },
    { name: 'door-open', visible: false, rows: [
      '', '', '', '', '', '', '', '', '', '', '',
      '                     ░░░█',
      '                     ░░░█',
      '                     ░░░█',
      '                     ░░░█',
      '                     ░░░█',
      '                   ░░░░░░░'
      ],
      legend: {
        '░': { frames: '░░▒░', inks: [9, 10, 9, 8], stagger: 'grid' },
        '█': 7
      }
    }
  ],
  hotspots: [
    { x: 21, y: 10, w: 4, h: 6, command: 'KNOCK' },
    { x: 38, y: 10, w: 7, h: 3, command: 'READ SIGN' },
    { x: 11, y: 8, w: 3, h: 2, command: 'EXAMINE WINDOW' }
  ]
};

var open = false;

var term = new Illum.Term(document.getElementById('term'), { onCommand: handle });
var art = new Illum.Illumination(ART);

term.print('The Crossroads', 'title');
term.print('Four roads meet in the dark and take their chances. At the meeting stands an inn, windows lit, smoke standing patiently out of the chimney. In every age you have ever landed in, it has been here, and open.');
term.illuminate(art);
term.print('[spike: try KNOCK, READ SIGN, EXAMINE WINDOW. Tapping works too. Hold H to outline hotspots.]', 'term-dim');

function handle(cmd) {
  if (cmd === 'KNOCK' || cmd === 'KNOCK ON DOOR') {
    if (open) return 'The door is already open. Knocking now would be a performance.';
    open = true;
    art.setLayer('door-open', true);
    return 'The door opens before your second knuckle lands. The landlady looks you over, places you to within a century, and stands aside. Warm air does the rest.';
  }
  if (cmd === 'READ SIGN' || cmd === 'EXAMINE SIGN' || cmd === 'X SIGN') {
    return 'THE TURNING HOUSE. Under the letters, a wheel with too many spokes to count while it hangs still. It is never quite hanging still.';
  }
  if (cmd === 'EXAMINE WINDOW' || cmd === 'X WINDOW') {
    return 'Lit. Inside, someone laughs at a story you arrived a thousand years too late to hear.';
  }
  if (cmd === 'EXAMINE DOOR' || cmd === 'X DOOR') return open ? 'Open on the common room.' : 'Oak, black with hands.';
  if (cmd === 'ENTER' || cmd === 'IN' || cmd === 'ENTER INN' || cmd === 'OPEN DOOR') {
    return open ? 'The threshold is as far as this page goes.' : 'Manners. Knock.';
  }
  if (cmd === 'EXAMINE SMOKE' || cmd === 'X SMOKE') return 'Applewood. Supper, then.';
  if (cmd === 'LOOK' || cmd === 'L') return 'The inn stands at the crossroads.' + (open ? ' Its door is open.' : '');
  return 'Nothing happens.';
}
</script>
</body>
</html>
